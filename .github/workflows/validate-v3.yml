name: Validate V3 Rust build
on:
  push:
    branches: ["main", "optimization/v3"]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Verify benchmark Python syntax
        run: python3 -m py_compile benchmark.py
      - name: Create Cargo source directory
        run: mkdir -p src && cp main.rs pq.rs src/
      - name: Install Parquet test reader
        run: python3 -m pip install --user pyarrow==23.0.0
      - name: Compile debug binary
        run: cargo check --offline
      - name: Build release binary
        run: cargo build --release --offline
      - name: Validate end-to-end correctness
        run: python3 tests/smoke.py target/release/ss
      - name: Build original main baseline
        run: |
          git fetch origin fabf66e8d2b3864fe5e92098dec13b0eb30f5f0d --depth=1
          mkdir -p baseline/src
          git show FETCH_HEAD:Cargo.toml > baseline/Cargo.toml
          git show FETCH_HEAD:main.rs > baseline/src/main.rs
          git show FETCH_HEAD:pq.rs > baseline/src/pq.rs
          cargo build --manifest-path baseline/Cargo.toml --release --offline
      - name: Compare baseline and V3 on synthetic input
        run: python3 tests/compare_performance.py --baseline baseline/target/release/ss --candidate target/release/ss --events 200000 --clicks 100000 --repeats 3
